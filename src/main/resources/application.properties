spring.application.name=sc-atas-booking
server.port=9095
server.servlet.context-path=/booking
spring.datasource.url=jdbc:mysql://localhost:3306/scatas_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.registry.fetch-interval-seconds=5

resilience4j.circuitbreaker.instances.flightsSelectionService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.flightsSelectionService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.flightsSelectionService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.flightsSelectionService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.flightsSelectionService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.flightsSelectionService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.flightsSelectionService.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.seatSelectionService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.seatSelectionService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.seatSelectionService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.seatSelectionService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.seatSelectionService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.seatSelectionService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.seatSelectionService.automaticTransitionFromOpenToHalfOpenEnabled=true

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*